<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-preset="classic">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>API → DB Map</title>
<script>
(function () {
  try {
    var theme = null;
    try { theme = localStorage.getItem("api-db-map-theme"); } catch (e) {}
    if (theme !== "light" && theme !== "dark") {
      theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<noscript>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
</noscript>

    --both-fill: rgba(251,146,60,.16);
    --fk: #FB7185;
    --fk-fill: rgba(251,113,133,.14);
    --uncert: #64748B;
    --group: #F59E0B;
    --external: #94A3B8;
    --external-fill: rgba(148,163,184,.14);
    --frontend: #22D3EE;
    --frontend-fill: rgba(34,211,238,.14);

  [data-preset="editorial"][data-theme="light"] {
    --bg: #F4EFE6; --canvas: #FFFAF3; --grid: #E4D9C8; --card: #FFFAF3;
    --ink: #242018; --muted: #7A7268; --line: #E6DCCB; --panel-border: #E6DCCB;
    --toolbar-bg: rgba(255,250,243,.92);
    --api: #397b53; --api-fill: rgba(15,118,110,.10);
    --table: #6D28D9; --table-fill: rgba(109,40,217,.10);
    --write: #B45309; --write-fill: rgba(180,83,9,.10);
    --read: #287e84; --read-fill: rgba(31,117,126,.09);
    --both: #C2410C; --both-fill: rgba(194,65,12,.10);
    --fk: #9e463f; --fk-fill: rgba(190,24,93,.10);

    --read: #287e84; --read-fill: rgba(96,165,250,.14);
    --both: #EA580C; --both-fill: rgba(251,146,60,.15);

    --api: #087F69; --api-fill: rgba(8,127,105,.12);

    --both: #C2410C; --both-fill: rgba(194,65,12,.12);
    --fk: #C53A59; --fk-fill: rgba(197,58,89,.12);
    --group: #B9670B;
  }
  [data-preset="editorial"][data-theme="dark"] {
    --bg: #181611; --canvas: #1C1914; --grid: #2A261F; --card: #1C1914;
    --ink: #F4EDDF; --muted: #B3A894; --line: #3A342A; --panel-border: #3A342A;
    --toolbar-bg: rgba(24,22,17,.9);
    --api: #5EEAD4; --api-fill: rgba(94,234,212,.16);
    --table: #C4B5FD; --table-fill: rgba(196,181,253,.16);
    --write: #DD6B3D; --write-fill: rgba(221,107,61,.16);
    --read: #93C5FD; --read-fill: rgba(147,197,253,.16);
    --fk: #FDA4AF; --fk-fill: rgba(253,164,175,.16);
    --group: #DD6B3D;
  }
  [data-preset="classic"][data-theme="dark"] {
    --bg: #030711; --canvas: #0B1220; --grid: #1E293B; --card: #0F172A;
    --ink: #F5FBFF; --muted: #94A3B8; --line: #334155; --panel-border: #334155;
    --toolbar-bg: rgba(7,16,30,.86);
    --api: #34D399; --api-fill: rgba(52,211,153,.16);
    --table: #A78BFA; --table-fill: rgba(167,139,250,.16);
    --write: #FBBF24; --write-fill: rgba(251,191,36,.14);
    --read: #67E8F9; --read-fill: rgba(103,232,249,.14);
    --fk: #FB7185; --fk-fill: rgba(251,113,133,.14);
    --group: #FBBF24;
  }
  [data-preset="signal-flow"][data-theme="dark"] {
    --bg: #041620; --canvas: #072433; --grid: #123246; --card: #0A2C3E;
    --ink: #E9F7FF; --muted: #7FA8BC; --line: #1F5068; --panel-border: #1F5068;
    --toolbar-bg: rgba(4,26,38,.88);
    --api: #2DD4BF; --api-fill: rgba(45,212,191,.16);
    --table: #9F8FEF; --table-fill: rgba(159,143,239,.16);
    --write: #F0A94E; --write-fill: rgba(240,169,78,.14);
    --read: #38BDF8; --read-fill: rgba(56,189,248,.16);
    --fk: #F472B6; --fk-fill: rgba(244,114,182,.14);
    --group: #F0A94E;
  }
  [data-preset="blueprint"][data-theme="light"] {
    --bg: #EDF7FA; --canvas: #F9FDFF; --grid: #B5D5E1; --card: #F9FDFF;
    --ink: #123344; --muted: #4E7486; --line: #9CC0D0; --panel-border: #78AABD;
    --toolbar-bg: rgba(247,252,254,.94);
    --api: #08755F; --api-fill: rgba(8,117,95,.08);
    --table: #6757A8; --table-fill: rgba(103,87,168,.08);
    --write: #A86609; --write-fill: rgba(168,102,9,.08);
    --read: #087F9C; --read-fill: rgba(8,127,156,.08);
    --both: #B65120; --both-fill: rgba(182,81,32,.08);
    --fk: #B32F50; --fk-fill: rgba(179,47,80,.08);
    --group: #5E90A6;
  }
  [data-preset="blueprint"][data-theme="dark"] {
    --bg: #06131F; --canvas: #0A1E30; --grid: #17425A; --card: #0D2740;
    --ink: #E3F6FF; --muted: #91B8CA; --line: #2C5B76; --panel-border: #27627F;
    --toolbar-bg: rgba(7,28,45,.92);
    --api: #69DFBD; --api-fill: rgba(105,223,189,.14);
    --table: #B4A8FF; --table-fill: rgba(180,168,255,.16);
    --write: #FFD166; --write-fill: rgba(255,209,102,.14);
    --read: #66D9EF; --read-fill: rgba(102,217,239,.14);
    --both: #FFAD66; --both-fill: rgba(255,173,102,.16);
    --fk: #FF8DA1; --fk-fill: rgba(255,141,161,.14);
    --group: #34799A;
  }
  /* Blueprint trades rounded, glowing chrome for squared, drafting-style precision. */
  [data-preset="blueprint"] .card,
  [data-preset="blueprint"] .panel,
  [data-preset="blueprint"] .group,
  [data-preset="blueprint"] .stat,
  [data-preset="blueprint"] .pill,
  [data-preset="blueprint"] .badge,
  [data-preset="blueprint"] .chip,
  [data-preset="blueprint"] .tab,
  [data-preset="blueprint"] .tool,
  [data-preset="blueprint"] .preset-menu,
  [data-preset="blueprint"] table.grid { border-radius: 3px; }

  .chrome { position:fixed; top:1rem; right:1rem; z-index:40; display:flex; gap:.5rem; }
  .chrome button {
    background: var(--toolbar-bg); color: var(--ink); border:1px solid var(--panel-border);
    padding:.5rem .875rem; border-radius:.625rem; font:inherit; font-size:.75rem; cursor:pointer;
    backdrop-filter:blur(10px); box-shadow:var(--shadow); min-height:2.5rem;
  }
  .chrome button:hover { filter:brightness(1.04); }
  .chrome button:focus-visible { outline:2px solid var(--frontend); outline-offset:2px; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.45 "JetBrains Mono","SFMono-Regular","PingFang SC","Noto Sans SC","Segoe UI",ui-monospace,system-ui,sans-serif;
  }
  .page { max-width: 1280px; margin: 0 auto; padding: 28px 22px 56px; }
  header.app { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 14px; }
  .brand { display: flex; gap: 10px; align-items: flex-start; }
  .pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--api); margin-top: 8px;
    box-shadow: 0 0 0 4px var(--api-fill); }
  header.app h1 { margin: 0; font-size: 22px; letter-spacing: -.025em; font-weight: 700; }
  header.app .sub { color: var(--muted); margin-top: 4px; font-size: 12px; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .stat { background: var(--card); border: 1px solid var(--panel-border); border-radius: 999px; padding: 4px 10px; color: var(--muted); }
  .stat b { color: var(--ink); font-weight: 650; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0 16px; position: relative; z-index: 30; }
  .toolbar input {
    border: 1px solid var(--panel-border); background: var(--toolbar-bg); color: var(--ink);
    border-radius: 10px; padding: 7px 10px; min-width: 220px; outline: none;
  }
  .toolbar input:focus { border-color: var(--api); }
  .chip, .tab, .tool {
    border: 1px solid var(--panel-border); background: var(--toolbar-bg); color: var(--muted);
    border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit;
  }
  .tool { border-radius: 10px; box-shadow: var(--shadow); }
  .chip.on, .tab.on { border-color: var(--ink); color: var(--ink); background: var(--card); }
  .tabs { display: flex; gap: 8px; }
  .spacer { flex: 1; }

  .preset-wrap { position: relative; }
  #btn-preset { display: flex; align-items: center; gap: 6px; }
  #btn-preset .chev { font-size: 9px; color: var(--muted); transition: transform .15s ease; }
  .preset-wrap.open #btn-preset .chev { transform: rotate(180deg); }
  .preset-menu {
    display: none; position: absolute; right: 0; top: calc(100% + 6px); min-width: 220px;
    background: var(--toolbar-bg); border: 1px solid var(--panel-border); border-radius: 12px;
    padding: 6px; box-shadow: 0 16px 40px rgba(0,0,0,.16); z-index: 100; backdrop-filter: blur(10px);
  }
  .preset-wrap.open .preset-menu { display: block; }
  .preset-option {
    width: 100%; display: flex; align-items: center; gap: 8px; text-align: left;
    background: transparent; border: 0; color: var(--ink); padding: 7px 8px;
    border-radius: 8px; cursor: pointer; font: inherit;
  }
  .preset-option:hover, .preset-option[aria-checked="true"] { background: var(--api-fill); }
  .preset-swatch { width: 16px; height: 16px; border-radius: 4px; flex: none; border: 1.5px solid; }
  .preset-swatch.classic { background: #E2E8F0; border-color: #059669; }
  .preset-swatch.signal-flow { background: #D7E7F0; border-color: #0789A1; }
  .preset-swatch.blueprint { background: #B5D5E1; border-color: #087F9C; }
  .preset-swatch.editorial { background: #E4D9C8; border-color: #B45309; }
  .preset-copy { display: flex; flex-direction: column; min-width: 0; }
  .preset-copy strong { font-size: 12px; font-weight: 650; }
  .preset-copy small { font-size: 10px; color: var(--muted); }
  .panel {
    background: var(--card); border: 1px solid var(--panel-border); border-radius: 18px;
    overflow: hidden; box-shadow: var(--shadow);
  }
  .canvas-wrap {
    position: relative; height: 640px; background: var(--canvas);
    overflow: hidden;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: visible; }
  .edge-label { font-size: 10px; fill: var(--muted); font-family: inherit; }
  .pill {
    position: absolute; top: 14px; left: 14px; z-index: 3;
    background: var(--toolbar-bg); border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 3px 8px; font-size: 12px; color: var(--muted);
    backdrop-filter: blur(8px);
  }
  .nodes { position: relative; z-index: 2; padding: 52px 22px 28px; display: flex; gap: 56px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 10px; min-width: 220px; }
  .col h3 { margin: 0 0 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .group {
    border: 1.5px dashed var(--group); border-radius: 16px; padding: 12px;
    display: flex; flex-direction: column; gap: 8px; background: transparent;
  }
  .card {
    background: var(--card); border: 1.5px solid var(--line); border-radius: 12px;
    padding: 8px 10px; cursor: pointer; min-width: 200px;
  }
  .card.api { border-color: var(--api); background: var(--api-fill); }
  .card.tbl { border-color: var(--table); background: var(--table-fill); }
  .card.dim { opacity: .28; }
  .card .kicker { font-size: 10px; letter-spacing: .06em; color: var(--muted); }
  .card .title { font-weight: 650; font-size: 13px; }
  .card .meta { font-size: 11px; color: var(--muted); }
  .badges { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .badge { font-size: 10px; border-radius: 999px; padding: 1px 6px; border: 1px solid transparent; }
  .badge.R { background: var(--read-fill); color: var(--read); border-color: color-mix(in srgb, var(--read) 30%, transparent); }
  .badge.W { background: var(--write-fill); color: var(--write); border-color: color-mix(in srgb, var(--write) 30%, transparent); }
  .badge.RW { background: var(--both-fill); color: var(--both); border-color: color-mix(in srgb, var(--both) 30%, transparent); }
  .badge.U { background: transparent; color: var(--uncert); border-color: var(--line); }
  .caption { padding: 16px 22px 18px; border-top: 1px solid var(--panel-border); background: var(--card); }
  .caption h2 { margin: 0 0 4px; font-size: 18px; letter-spacing: -.02em; }
  .caption p { margin: 0; color: var(--muted); }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; padding: 10px 22px 12px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--panel-border); }
  .dot { width: 16px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; vertical-align: middle; }
  table.grid { width: 100%; border-collapse: collapse; margin-top: 16px; background: var(--card); border: 1px solid var(--panel-border); border-radius: 14px; overflow: hidden; }
  table.grid th, table.grid td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--panel-border); vertical-align: top; }
  table.grid th { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
  table.grid tr { cursor: pointer; }
  table.grid tr:hover td { background: color-mix(in srgb, var(--api-fill) 70%, transparent); }
  .fields { margin-top: 6px; }
  .field { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; padding: 3px 0; border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
  .field.pk { font-weight: 650; }
  .field.fk { color: var(--fk); }
  .field.unused { opacity: .35; }
  .field .t { color: var(--muted); }
  #view-t03 { padding: 48px 12px 16px; box-sizing: border-box; overflow: visible; }
  #view-t03 .seq { display: block; max-width: none; }
  .seq-participant { transition: none; }
  .seq-participant:hover rect { filter: brightness(1.1); }
  .seq-msg { cursor: default; }
  .seq-msg:hover rect { filter: brightness(1.08); stroke-width: 1.2px; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  #canvas-scale { position: relative; overflow: auto; height: 100%; }
  #canvas-inner { position: relative; min-height: 100%; }
  .edge-label-bg { fill: var(--card); stroke: var(--panel-border); stroke-width: 0.7; }
  .edge-label { font-size: 10px; fill: var(--ink); font-family: inherit; }
  .field-more { font-size: 11px; color: var(--muted); padding: 6px 0 2px; cursor: pointer; }
  .card.mod { border-style: dashed; }
  .evidence-banner {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 22px; border-top: 1px solid var(--panel-border);
    background: var(--frontend-fill); font-size: 12px;
  }
  .evidence-banner[hidden] { display: none; }
  .evidence-banner code {
    background: color-mix(in srgb, var(--line) 40%, transparent);
    border-radius: 4px; padding: 1px 5px;
  }
  .conclusion-cards {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    padding: 0 0 16px;
  }
  .conclusion {
    background: var(--card); border: 1px solid var(--panel-border); border-radius: 14px;
    padding: 12px 14px;
  }
  .conclusion h3 { margin: 0 0 6px; font-size: 13px; }
  .conclusion p, .conclusion li { margin: 0; color: var(--muted); font-size: 12px; }
  .conclusion ul { margin: 0; padding-left: 16px; }
  .summary-fold { margin-top: 4px; }
  .summary-fold > summary {
    cursor: pointer; color: var(--muted); font-size: 12px; padding: 8px 0;
  }
  @media (max-width: 860px) {
    .conclusion-cards { grid-template-columns: 1fr; }
  }
  .diagram-nav {
    position: absolute; bottom: 14px; right: 14px; z-index: 15; display: flex; gap: 4px;
  }
  .diagram-nav button {
    background: var(--toolbar-bg); color: var(--ink); border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 11px; cursor: pointer;
    backdrop-filter: blur(8px); min-width: 2.4rem; min-height: 1.9rem;
  }
  .diagram-nav button:hover { filter: brightness(1.06); }
  .diagram-nav button:focus-visible { outline: 2px solid var(--frontend); outline-offset: 2px; }

  .card.path { border-color: var(--frontend); box-shadow: 0 0 0 2px var(--frontend-fill); }
  .card.path-step { border-color: var(--frontend); background: var(--frontend-fill); box-shadow: 0 0 0 2px var(--frontend); }

  .side-panel {
    position: fixed; top: 120px; right: 20px; width: min(340px, calc(100vw - 40px)); max-height: calc(100vh - 140px);
    background: var(--toolbar-bg); border: 1px solid var(--panel-border); border-radius: 14px;
    box-shadow: 0 20px 48px rgba(0,0,0,.22); backdrop-filter: blur(12px); z-index: 40;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .side-panel[hidden] { display: none; }
  .side-panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid var(--panel-border);
  }
  .side-panel-kicker { font-size: 11px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; font-weight: 650; }
  .side-panel-close {
    background: transparent; border: 0; color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer; padding: 2px 4px;
  }
  .side-panel-close:hover { color: var(--ink); }
  .side-panel-body { padding: 10px 12px; overflow-y: auto; flex: 1; }

  if(k.indexOf("tbl:")===0) return (IR.tables||[]).some(t=>t.name===k.slice(4));
  return false;
}
function routeLabel(key){
  if(!key) return "";
  if(key.indexOf("ep:")===0){ const ep=(IR.endpoints||[]).find(e=>e.id===key.slice(3)); return ep ? ep.method+" "+ep.path : key.slice(3); }
  if(key.indexOf("tbl:")===0) return key.slice(4);
  return key;
}
function routePathSets(){
  const tblSet = new Set(), epSet = new Set();
  let curKey = null;
  if(routeState.path){
    routeState.path.forEach(k => { if(k.indexOf("tbl:")===0) tblSet.add(k.slice(4)); else if(k.indexOf("ep:")===0) epSet.add(k.slice(3)); });
    if(routeState.stepIndex>=0) curKey = routeState.path[routeState.stepIndex];
  }
  return {tblSet, epSet, curKey};
}

// --- URL hash deep-linking (state -> #tab=..&ep=..&tbl=..&route=.. ; never pushState) ---
function writeHash(){
  const params = new URLSearchParams();
  params.set("tab", tab);
  if(selected) params.set("ep", selected);
  if(detailTarget && detailTarget.type==="tbl") params.set("tbl", detailTarget.id);
  if(routeState.path) params.set("route", routeState.path.join(">"));
  const hash = params.toString();
  history.replaceState(null, "", location.pathname + location.search + (hash ? ("#"+hash) : ""));
}
function readHash(){
  const params = new URLSearchParams(location.hash.replace(/^#/, ""));
  const t = params.get("tab");
  if(t && caps[t]) tab = t;
  const ep = params.get("ep");
  if(ep && (IR.endpoints||[]).some(e=>e.id===ep)){ selected = ep; detailTarget = {type:"ep", id:ep}; }
  const tblName = params.get("tbl");
  if(tblName && (IR.tables||[]).some(x=>x.name===tblName)){ detailTarget = {type:"tbl", id:tblName}; }
  const route = params.get("route");
  if(route){
    const keys = route.split(">");
    const adj = buildGraph();
    const linked = keys.length>=2 && keys.every(isValidNodeKey) &&
      keys.every((k,i) => i===0 || (adj[keys[i-1]]||[]).includes(k));
    if(linked){
      routeState.path = keys;
      routeState.startId = keys[0];
      routeState.endId = keys[keys.length-1];
      routeState.stepIndex = -1;
    }
  }
}

function offsetRel(el, ancestor){
  let x = 0, y = 0, n = el;
  while(n && n !== ancestor){
    x += n.offsetLeft;
    y += n.offsetTop;
    n = n.offsetParent;
  }
  return {x, y, w: el.offsetWidth, h: el.offsetHeight};
}
function wrapPt(el, side){
  const o = offsetRel(el, $("canvas-inner"));
  const x = side==="right" ? o.x + o.w : side==="left" ? o.x : o.x + o.w / 2;
  return {x, y: o.y + o.h / 2};
}
function isSignalFlow(){ return document.documentElement.getAttribute("data-preset")==="signal-flow"; }
function edgeStroke(writeLike){ return isSignalFlow() ? (writeLike ? 2.2 : 1.2) : 1.6; }
function edgeOpacity(writeLike){ return isSignalFlow() && !writeLike ? 0.55 : 1; }
function ortho(a, b, color, dash, label, channelX, writeLike){
  const d = `M ${a.x.toFixed(1)} ${a.y.toFixed(1)} H ${channelX.toFixed(1)} V ${b.y.toFixed(1)} H ${b.x.toFixed(1)}`;
  const midY = (a.y + b.y) / 2;
  const text = label || "";
  const tw = Math.max(28, text.length * 6.4 + 12);
  const sw = edgeStroke(writeLike);
  const op = edgeOpacity(writeLike);
  const marker = "arr-"+color.replace("#","");
  return `<path class="edge-path" d="${d}" fill="none" stroke="${color}" stroke-width="${sw}" opacity="${op}" ${dash?'stroke-dasharray="6 4"':""} marker-end="url(#${marker})" />` +
    (text ? `<g class="edge-cap"><rect class="edge-label-bg" x="${channelX - tw/2}" y="${midY - 16}" rx="4" width="${tw}" height="16"/>` +
      `<text class="edge-label" x="${channelX}" y="${midY - 4}" text-anchor="middle">${text}</text></g>` : "");
}
function ensureMarkers(svg, colors){
  let defs = `<defs>`;
  colors.forEach(c => {
    const id = "arr-"+c.replace("#","");
    defs += `<marker id="${id}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="${c}"/></marker>`;
  });
  defs += `</defs>`;
  svg.insertAdjacentHTML("afterbegin", defs);
}

function formatSeqLabel(s){
  const raw = s.label || "";
  const opBadge = s.op === "W" ? "[写] " : s.op === "R" ? "[读] " : "";
  let text = raw;
  const verb = raw.match(/^(SELECT|INSERT|UPDATE|DELETE|UPSERT|JOIN_READ)\b/i);
  const tbl = raw.match(/\b(?:FROM|INTO|UPDATE)\s+([\w.]+)/i);
  const list = raw.match(/^(?:SELECT|INSERT|UPDATE|DELETE|UPSERT)\s+(.+?)(?:\s+FROM\s|\s+INTO\s|\s+SET\s|\s+WHERE\s|$)/i);
  if(verb){
    let n = 0;
    if(list && list[1] && list[1].trim() !== "*"){
      n = list[1].split(",").map(x => x.trim()).filter(Boolean).length;
    }
    const table = tbl ? tbl[1].replace(/[`"'[\]]/g, "") : "";
    text = verb[1].toUpperCase() + (table ? " " + table : "");
    if(n) text += " (" + n + " 列)";
  } else if(text.length > 44){
    if(text.includes(" — ")) text = text.split(" — ")[0];
    else if(text.includes(";")) text = text.split(";")[0];
    if(text.length > 44) text = text.slice(0, 42) + "…";
  }
  return { display: opBadge + text, full: raw };
}

function partSub(p, ep){
  if(p === "Client") return "";
  if(p === "Controller") return ep.handler.file || "";
  if(/Service$/i.test(p) || p === ep.handler.fn) return ep.handler.fn || "";
  const t = (IR.tables||[]).find(x => x.name === p);
  return t ? (t.module || t.schema || "") : "";
}
function activationRanges(parts, sequence){
  const out = {};
  parts.forEach(p => {
    const hits = [];
    sequence.forEach((s, i) => { if(s.from === p || s.to === p) hits.push(i); });
    const segs = [];
    hits.forEach(i => {
      if(!segs.length || i > segs[segs.length-1].to + 1) segs.push({from:i, to:i});
      else segs[segs.length-1].to = i;
    });
    out[p] = segs;
  });
  return out;
}
function renderT03(){

  ep.sequence.forEach(s => { add(s.from); add(s.to); });

  const wrap = $("canvas");
  const availW = Math.max(720, (wrap ? wrap.clientWidth : 960) - 24);

  });
  const leftGutter = 56;
  const rightPad = 28;
  const minGap = 36;
  const minSpan = boxWidths.reduce((s, w) => s + w, 0) + minGap * Math.max(0, parts.length - 1);
  const totalW = Math.max(availW, leftGutter + minSpan + rightPad);
  const extra = Math.max(0, totalW - leftGutter - rightPad - minSpan);
  const gapX = minGap + extra / Math.max(1, parts.length);
  const colCenters = [];
  let curX = leftGutter;
  boxWidths.forEach((w) => {
    colCenters.push(curX + w / 2);
    curX += w + gapX;
  });
  const xOf = i => colCenters[i];
  const isTbl = p => (IR.tables||[]).some(t=>t.name===p);

  const cApi = css("--api") || "#0F766E";
  const cTbl = css("--table") || "#7C3AED";

  const cTblFill = css("--table-fill") || "rgba(124,58,237,.12)";

  const cWrite = css("--write") || "#C2410C";
  const cMuted = css("--muted") || "#6B645A";
  const cLine = css("--line") || "#DDD6C8";
  const cInk = css("--ink") || "#1C1915";
  const cFrontend = css("--frontend") || "#0E7490";
  const cFrontendFill = css("--frontend-fill") || "rgba(14,116,144,.15)";
  const cCard = css("--card") || "#ffffff";

  const focusedTbl = (detailTarget && detailTarget.type==="tbl") ? detailTarget.id : null;
  const y0 = 78;
  const steps = Math.max(1, ep.sequence.length);
  const gap = Math.max(44, Math.min(72, (availH - y0 - 40) / steps));
  const yAt = i => y0 + 12 + (i + 0.5) * gap;
  const bottomY = y0 + 12 + steps * gap + 20;
  let inner = "";

  const firstOp = ep.sequence.findIndex(s => s.op);
  let lastOp = -1;
  ep.sequence.forEach((s, i) => { if(s.op) lastOp = i; });
  const entryIdx = [];
  ep.sequence.forEach((s, i) => { if(s.from === "Client" && s.to === "Controller") entryIdx.push(i); });
  const phases = [];
  if(entryIdx.length) phases.push({id:"entry", label:"入口", from: Math.min(...entryIdx), to: Math.max(...entryIdx)});
  const bizFrom = entryIdx.length ? Math.max(...entryIdx) + 1 : 0;
  if(firstOp > bizFrom) phases.push({id:"biz", label:"业务", from: bizFrom, to: firstOp - 1});
  if(firstOp >= 0) phases.push({id:"db", label:"落库", from: firstOp, to: lastOp});
  phases.forEach(ph => {
    const top = yAt(ph.from) - 18;
    const h = yAt(ph.to) - yAt(ph.from) + 36;
    inner += `<g class="seq-phase" data-phase="${ph.id}">`;
    inner += `<rect x="8" y="${top}" width="${totalW - 16}" height="${h}" rx="10" fill="${cApiFill}" opacity="0.35"/>`;
    inner += `<text x="16" y="${top + 14}" font-size="10" fill="${cMuted}" font-family="inherit">${ph.label}</text>`;
    inner += `</g>`;
  });

  parts.forEach((p, i) => {
    const x = xOf(i);
    const w = boxWidths[i];
    const sub = partSub(p, ep);
    const isTargetTbl = focusedTbl && p === focusedTbl;
    const fill = isTargetTbl ? cFrontendFill : (isTbl(p) ? cTblFill : cApiFill);
    const stroke = isTargetTbl ? cFrontend : (isTbl(p) ? cTbl : cApi);
    const strokeW = isTargetTbl ? 2.5 : 1.5;
    const lineStroke = isTargetTbl ? cFrontend : cLine;
    const lineW = isTargetTbl ? 2 : 1;
    const cursor = isTbl(p) ? "pointer" : "default";
    const boxH = sub ? 44 : 32;

    inner += `<g class="seq-participant" data-tbl="${isTbl(p) ? escAttr(p) : ""}" style="cursor:${cursor}">`;
    inner += `<title>${isTbl(p) ? '点击查看 ' + escAttr(p) + ' 表详情' : escAttr(p)}</title>`;
    inner += `<rect x="${x - w/2}" y="6" rx="10" width="${w}" height="${boxH}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeW}"/>`;
    if(isTargetTbl) inner += `<circle cx="${x - w/2 + 12}" cy="18" r="3.5" fill="${cFrontend}"/>`;
    inner += `<text x="${x}" y="${sub ? 22 : 26}" text-anchor="middle" font-size="11" font-weight="${isTargetTbl ? 700 : 650}" fill="${cInk}" font-family="inherit">${escAttr(p)}</text>`;
    if(sub) inner += `<text x="${x}" y="38" text-anchor="middle" font-size="9" fill="${cMuted}" font-family="inherit">${escAttr(sub)}</text>`;
    inner += `</g>`;
    inner += `<line x1="${x}" y1="${6 + boxH}" x2="${x}" y2="${bottomY}" stroke="${lineStroke}" stroke-width="${lineW}" stroke-dasharray="3 4"/>`;
  });

  const acts = activationRanges(parts, ep.sequence);
  parts.forEach((p, i) => {
    const x = xOf(i);
    const color = isTbl(p) ? cTbl : cApi;
    (acts[p]||[]).forEach(seg => {
      const y1 = yAt(seg.from) - 8;
      const y2 = yAt(seg.to) + 8;
      inner += `<rect class="seq-activation" data-part="${escAttr(p)}" x="${x - 3}" y="${y1}" width="6" height="${Math.max(8, y2 - y1)}" rx="2" fill="${color}"/>`;
    });
  });

  ep.sequence.forEach((s, i) => {
    const y = yAt(i);
    const fromIdx = Math.max(0, parts.indexOf(s.from));
    const toIdx = Math.max(0, parts.indexOf(s.to));
    const a = xOf(fromIdx);
    const b = xOf(toIdx);
    const isSelf = s.from === s.to;
    const touchesTarget = focusedTbl && (s.from === focusedTbl || s.to === focusedTbl);
    let color = cMuted;
    let markerId = "arr-seq-muted";
    if(touchesTarget) { color = cFrontend; markerId = "arr-seq-hl"; }
    else if(s.op === "W") { color = cWrite; markerId = "arr-seq-write"; }
    else if(s.op === "R") { color = cRead; markerId = "arr-seq-read"; }
    else if(fromIdx === 0 && toIdx === 1) { color = cApi; markerId = "arr-seq-api"; }
    const isReturn = (!isSelf && b < a && !s.op);
    const dash = isReturn ? 'stroke-dasharray="4 4"' : '';
    const strokeW = touchesTarget ? 2.2 : 1.6;
    const labelInfo = formatSeqLabel(s);
    const estTextW = Math.min(380, Math.max(60, Math.round(labelInfo.display.length * 7.2 + 18)));

    if(isSelf) {
      const loopW = 28, loopH = 22;
      inner += `<path d="M ${a} ${y - 4} h ${loopW} v ${loopH} h -${loopW}" fill="none" stroke="${color}" stroke-width="${strokeW}" marker-end="url(#${markerId})"/>`;
      const tx = a + loopW + 8;
      inner += `<g class="seq-msg${isReturn?" seq-msg-return":""}"><title>${escAttr(labelInfo.full)}</title>`;
      inner += `<rect x="${tx}" y="${y - 3}" rx="4" width="${estTextW}" height="18" fill="${cCard}" stroke="${color}" stroke-width="0.8" opacity="0.95"/>`;
      inner += `<text x="${tx + 8}" y="${y + 10}" text-anchor="start" font-size="10" fill="${color}" font-family="inherit">${escAttr(labelInfo.display)}</text></g>`;
    } else {
      inner += `<line class="${isReturn?"seq-return":""}" x1="${a}" y1="${y}" x2="${b}" y2="${y}" stroke="${color}" stroke-width="${strokeW}" ${dash} marker-end="url(#${markerId})"/>`;
      const midX = (a + b) / 2;
      inner += `<g class="seq-msg${isReturn?" seq-msg-return":""}"><title>${escAttr(labelInfo.full)}</title>`;
      inner += `<rect x="${midX - estTextW / 2}" y="${y - 15}" rx="4" width="${estTextW}" height="16" fill="${cCard}" stroke="${color}" stroke-width="0.7" opacity="0.95"/>`;
      inner += `<text x="${midX}" y="${y - 3}" text-anchor="middle" font-size="10" fill="${color}" font-family="inherit">${escAttr(labelInfo.display)}</text></g>`;
    }
  });

  const totalH = bottomY + 28;
  let defs = `<defs>`;
  [["arr-seq-muted", cMuted],["arr-seq-read", cRead],["arr-seq-write", cWrite],["arr-seq-api", cApi],["arr-seq-hl", cFrontend]]
    .forEach(([mid, mc]) => { defs += `<marker id="${mid}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="${mc}"/></marker>`; });
  defs += `</defs>`;

  const svg = `<svg class="seq" data-vw="${totalW}" data-vh="${totalH}" width="${Math.round(totalW * zoomLevel)}" height="${Math.round(totalH * zoomLevel)}" viewBox="0 0 ${totalW} ${totalH}" preserveAspectRatio="xMidYMin meet">${defs}${inner}</svg>`;
  $("view-t03").innerHTML =
    `<div style="padding:10px 16px 6px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
      <div><b>${ep.method} ${ep.path}</b> · <code>${ep.handler.file}:${ep.handler.line||"?"}</code></div>
      <div style="font-size:11px;color:var(--muted)">悬停消息查看完整 SQL，点击数据表卡片可查看字段与详情</div>
    </div>` + svg;

  $("view-t03").querySelectorAll(".seq-participant[data-tbl]").forEach(el => {
    const tblName = el.dataset.tbl;
    if(tblName) el.onclick = () => selectTable(tblName);
  });
}

function renderSummary(){
  const rows = (IR.endpoints||[]).filter(visibleEp).map(ep => {
    const ts = ep.tables.map(t => {
      const isTarget = detailTarget && detailTarget.type==="tbl" && detailTarget.id===t.name;
      const hlStyle = isTarget ? "outline:1.5px solid var(--frontend);background:var(--frontend-fill);border-radius:4px;padding:1px 4px;font-weight:650;" : "";
      return `<span style="${hlStyle}">${escAttr(t.name)}</span> <span class="badge ${isWrite(t.op)&&isRead(t.op)?"RW":isWrite(t.op)?"W":"R"}">${t.op}</span>`;
    }).join("<br>");
    const conf = [...new Set(ep.tables.map(t=>t.confidence))].join(", ");
    const hl = selected===ep.id ? "font-weight:650" : "";
    return `<tr data-ep="${ep.id}" style="${hl}"><td>${ep.method}</td><td>${ep.path}</td><td>${ep.handler.fn}</td><td>${ts}</td><td>${conf}</td></tr>`;
  }).join("");
  $("summary").innerHTML = `<thead><tr><th>方法</th><th>路径</th><th>处理函数</th><th>表 / 操作</th><th>置信度</th></tr></thead><tbody>${rows}</tbody>`;
  $("summary").querySelectorAll("tr[data-ep]").forEach(tr => tr.onclick = () => selectEndpoint(tr.dataset.ep));
}
function renderCards(){
  const host = $("cards");
  if(!host || !IR) return;
  const eps = IR.endpoints || [];
  const writers = eps.filter(ep => ep.tables.some(t => isWrite(t.op))).length;
  const readers = eps.length - writers;
  const hot = Object.entries(IR.table_api_index || {})
    .sort((a, b) => b[1].length - a[1].length)
    .filter(([, ids]) => ids.length)
    .slice(0, 3);
  const uncertain = [];
  eps.forEach(ep => ep.tables.forEach(t => { if(t.confidence === "uncertain") uncertain.push({ep: ep.id, ev: t.evidence, table: t.name}); }));
  const hotItems = hot.length
    ? hot.map(([name, ids]) => `<li>${escAttr(name)} · ${ids.length} 个接口</li>`).join("")
    : "<li>没有表被接口引用</li>";
  const uncItems = uncertain.slice(0, 2).map(u => `<li>${escAttr(u.table)} · <code>${escAttr(u.ev || "—")}</code></li>`).join("");
  host.innerHTML = `
    <article class="conclusion" data-card="rw">
      <h3>读写接口</h3>
      <p><b data-writers="${writers}">${writers}</b> 个有写 · <b data-readers="${readers}">${readers}</b> 个只读</p>
    </article>
    <article class="conclusion" data-card="hot">
      <h3>热点表</h3>
      <ul>${hotItems}</ul>
    </article>
    <article class="conclusion" data-card="uncertain">
      <h3>不确定</h3>
      <p><b data-uncertain="${uncertain.length}">${uncertain.length}</b> 条</p>
      ${uncItems ? `<ul>${uncItems}</ul>` : ""}
    </article>`;
}
function renderEvidenceBanner(){
  const el = $("evidence-banner");
  if(!el) return;
  if(!detailTarget || !IR){ el.hidden = true; el.innerHTML = ""; return; }
  if(detailTarget.type === "ep"){
    const ep = (IR.endpoints||[]).find(e => e.id === detailTarget.id);
    if(!ep){ el.hidden = true; return; }
    const first = ep.tables[0];
    el.innerHTML = `<b>${escAttr(ep.method)} ${escAttr(ep.path)}</b><span>${escAttr(ep.handler.file)}:${ep.handler.line||"?"}</span>${first ? `<code>${escAttr(first.evidence||"—")}</code>` : ""}`;
    el.hidden = false;
    return;
  }
  const t = (IR.tables||[]).find(x => x.name === detailTarget.id);
  if(!t){ el.hidden = true; return; }
  let ev = "";
  (IR.endpoints||[]).some(ep => ep.tables.some(et => { if(et.name===t.name){ ev = et.evidence; return true; } return false; }));
  el.innerHTML = `<b>${escAttr(t.name)}</b><span>${escAttr(t.module||t.schema||"")}</span>${ev ? `<code>${escAttr(ev)}</code>` : ""}`;
  el.hidden = false;
}

// --- Selection / detail panel ---
function selectEndpoint(id){
  if(selected===id){ selected = null; detailTarget = null; }
  else { selected = id; detailTarget = {type:"ep", id}; }
  renderDetail();
  render();
  writeHash();
}
function selectTable(name){
  if(detailTarget && detailTarget.type==="tbl" && detailTarget.id===name){ detailTarget = null; }
  else { detailTarget = {type:"tbl", id:name}; }
  renderDetail();
  render();
  writeHash();
}
function closeDetail(){
  detailTarget = null;
  renderDetail();
  render();
  writeHash();
}
function renderDetail(){
  const drawer = $("detail-drawer");
  if(!drawer) return;
  if(!detailTarget){ drawer.hidden = true; return; }
  if(detailTarget.type==="ep"){
    const ep = (IR.endpoints||[]).find(e=>e.id===detailTarget.id);
    if(!ep){ detailTarget = null; drawer.hidden = true; return; }
    drawer.hidden = false;
    $("detail-kicker").textContent = "接口详情";
    const rows = ep.tables.map(t => {
      const badge = isWrite(t.op)&&isRead(t.op) ? "RW" : isWrite(t.op) ? "W" : "R";
      return `<div class="detail-row">
        <div class="detail-row-head"><b>${escAttr(t.name)}</b><span class="badge ${badge}">${t.op}</span><span class="conf conf-${t.confidence}">${t.confidence}</span></div>
        ${t.fields_read&&t.fields_read.length?`<div class="detail-fields">读: ${t.fields_read.map(escAttr).join(", ")}</div>`:""}
        ${t.fields_written&&t.fields_written.length?`<div class="detail-fields">写: ${t.fields_written.map(escAttr).join(", ")}</div>`:""}
        <div class="detail-evidence">依据：<code>${escAttr(t.evidence||"—")}</code></div>
      </div>`;
    }).join("");
    $("detail-body").innerHTML = `
      <div class="detail-title">${escAttr(ep.method)} ${escAttr(ep.path)}</div>
      <div class="detail-sub">处理函数 <code>${escAttr(ep.handler.fn)}</code> · <code>${escAttr(ep.handler.file)}:${ep.handler.line||"?"}</code></div>
      <div class="detail-rows">${rows}</div>`;
  } else if(detailTarget.type==="tbl"){
    const t = (IR.tables||[]).find(x=>x.name===detailTarget.id);
    if(!t){ detailTarget = null; drawer.hidden = true; return; }
    drawer.hidden = false;
    $("detail-kicker").textContent = "表详情";
    const touches = [];
    (IR.endpoints||[]).forEach(ep => ep.tables.forEach(et => { if(et.name===t.name) touches.push({ep, et}); }));
    const rows = touches.map(({ep, et}) => {
      const badge = isWrite(et.op)&&isRead(et.op) ? "RW" : isWrite(et.op) ? "W" : "R";
      return `<div class="detail-row">
        <div class="detail-row-head"><b>${escAttr(ep.method)} ${escAttr(ep.path)}</b><span class="badge ${badge}">${et.op}</span></div>
        <div class="detail-evidence">依据：<code>${escAttr(et.evidence||"—")}</code></div>
      </div>`;
    }).join("");
    $("detail-body").innerHTML = `
      <div class="detail-title">${escAttr(t.name)}</div>
      <div class="detail-sub">${escAttr(t.module||t.schema||"")} · ${(t.fields||[]).length} 字段</div>
      <div class="detail-rows">${rows || "<div class='meta'>没有接口引用此表</div>"}</div>`;
  }
}

// --- Node finder (jump-to, also reused to pick route endpoints) ---
function finderItems(){
  const eps = (IR.endpoints||[]).map(ep => ({
    kind:"ep", id:ep.id, label:`${ep.method} ${ep.path}`, meta:`${ep.tables.length} 张表 · ${ep.handler.fn}`,
    search:(ep.id+" "+ep.path+" "+ep.handler.fn).toLowerCase()
  }));
  const tbls = (IR.tables||[]).map(t => ({
    kind:"tbl", id:t.name, label:t.name, meta:`${(t.fields||[]).length} 字段` + (t.module||t.schema?(" · "+(t.module||t.schema)):""),
    search:(t.name+" "+(t.module||"")+" "+(t.schema||"")).toLowerCase()
  }));
  return eps.concat(tbls);
}
function openFinder(mode){
  finderMode = mode || "jump";
  if(!finderAll) finderAll = finderItems();
  $("finder-overlay").hidden = false;
  const input = $("finder-input");
  input.value = "";
  $("finder-hint").textContent = mode==="route-start" ? "选择路径追踪的起点" : mode==="route-end" ? "选择路径追踪的终点" : "输入以查找接口或表，↑↓选择，Enter 跳转，Esc 关闭";
  renderFinderResults("");
  requestAnimationFrame(() => input.focus());
}
function closeFinder(){
  finderMode = null;
  $("finder-overlay").hidden = true;
}
function renderFinderResults(q){
  const ql = q.trim().toLowerCase();
  const items = finderAll.filter(it => !ql || it.search.includes(ql)).slice(0, 30);
  finderCurrentItems = items;
  finderActiveIndex = 0;
  $("finder-results").innerHTML = items.map((it,i) => `
    <button class="finder-result${i===0?" active":""}" data-idx="${i}" type="button">
      <span class="finder-tag">${it.kind==="ep"?"接口":"表"}</span>
      <span class="finder-copy"><strong>${escAttr(it.label)}</strong><small>${escAttr(it.meta)}</small></span>
    </button>`).join("") || `<div class="finder-empty">没有匹配结果</div>`;
  $("finder-results").querySelectorAll(".finder-result").forEach((b,i) => {
    b.onclick = () => chooseFinderResult(items[i]);
  });
}
function moveFinderActive(delta){
  if(!finderCurrentItems.length) return;
  finderActiveIndex = (finderActiveIndex + delta + finderCurrentItems.length) % finderCurrentItems.length;
  $("finder-results").querySelectorAll(".finder-result").forEach((b,i) => b.classList.toggle("active", i===finderActiveIndex));
  const activeEl = $("finder-results").querySelector(".finder-result.active");
  if(activeEl) activeEl.scrollIntoView({block:"nearest"});
}
function chooseFinderResult(item){
  if(!item) return;
  const key = (item.kind==="ep"?"ep:":"tbl:") + item.id;
  if(finderMode==="route-start"){ routeState.startId = key; closeFinder(); maybeComputeRoute(); return; }
  if(finderMode==="route-end"){ routeState.endId = key; closeFinder(); maybeComputeRoute(); return; }
  if(item.kind==="ep"){ if(tab==="t02") switchTab("t01"); selectEndpoint(item.id); }
  else { selectTable(item.id); }
  closeFinder();
}

// --- Route probe (BFS shortest path over the endpoint<->table graph + step playback) ---
function openRoutePanel(){
  $("route-panel").hidden = false;
  renderRoutePanel();
}
function closeRoutePanel(){
  $("route-panel").hidden = true;
}
function maybeComputeRoute(){
  if(routeState.startId && routeState.endId){
    const path = bfsPath(buildGraph(), routeState.startId, routeState.endId);
    routeState.path = path;
    routeState.stepIndex = -1;
    stopJourney();
    render();
    writeHash();
  }
  openRoutePanel();
}
function clearRoute(){
  routeState.startId = null; routeState.endId = null; routeState.path = null; routeState.stepIndex = -1;
  stopJourney();
  render();
  writeHash();
  renderRoutePanel();
}
function renderRoutePanel(){
  const body = $("route-body");
  if(!body) return;
  const startLabel = routeState.startId ? routeLabel(routeState.startId) : null;
  const endLabel = routeState.endId ? routeLabel(routeState.endId) : null;
  let html = `<div class="route-picks">
    <button class="route-pick" id="route-pick-start" type="button">${startLabel ? escAttr(startLabel) : "选择起点…"}</button>
    <span class="route-arrow">&rarr;</span>
    <button class="route-pick" id="route-pick-end" type="button">${endLabel ? escAttr(endLabel) : "选择终点…"}</button>
  </div>`;
  if(routeState.path){
    html += `<div class="route-chain">` + routeState.path.map((k,i) => {
      const cur = i===routeState.stepIndex;
      return (i>0 ? '<span class="route-arrow">&rarr;</span>' : "") + `<span class="route-chip" data-current="${cur}">${escAttr(routeLabel(k))}</span>`;
    }).join("") + `</div>`;
    html += `<div class="route-journey">
      <button id="route-prev" type="button" title="上一步">&larr;</button>
      <button id="route-play" type="button" title="播放/暂停步进">${routeState.playing ? "暂停" : "播放"}</button>
      <button id="route-next" type="button" title="下一步">&rarr;</button>
      <button id="route-all" type="button" title="显示整条路径">总览</button>
    </div>`;
  } else if(routeState.startId && routeState.endId){
    html += `<div class="meta">两点之间没有可达路径</div>`;
  }
  html += `<div class="route-actions">
    ${routeState.path ? '<button id="route-copy" type="button">复制链接</button>' : ""}
    <button id="route-clear" type="button">清除</button>
  </div>`;
  body.innerHTML = html;
  $("route-pick-start").onclick = () => openFinder("route-start");
  $("route-pick-end").onclick = () => openFinder("route-end");
  $("route-clear").onclick = clearRoute;
  if(routeState.path){
    $("route-prev").onclick = () => stepRoute(-1);
    $("route-next").onclick = () => stepRoute(1);
    $("route-all").onclick = () => { routeState.stepIndex = -1; stopJourney(); renderRoutePanel(); render(); };
    $("route-play").onclick = toggleJourney;
    const copyBtn = $("route-copy");
    if(copyBtn) copyBtn.onclick = () => { writeHash(); copyText(location.href); };
  }
}
function stepRoute(delta){
  if(!routeState.path) return;
  if(routeState.stepIndex<0){ routeState.stepIndex = delta>0 ? 0 : routeState.path.length-1; }
  else { routeState.stepIndex = Math.max(0, Math.min(routeState.path.length-1, routeState.stepIndex+delta)); }
  renderRoutePanel();
  render();
}
function toggleJourney(){ routeState.playing ? stopJourney() : startJourney(); }
function startJourney(){
  if(!routeState.path) return;
  routeState.playing = true;
  if(routeState.stepIndex<0 || routeState.stepIndex>=routeState.path.length-1) routeState.stepIndex = 0;
  renderRoutePanel(); render();
  routeState.timer = setInterval(() => {
    if(routeState.stepIndex>=routeState.path.length-1){ stopJourney(); renderRoutePanel(); return; }
    routeState.stepIndex++;
    renderRoutePanel(); render();
  }, 1100);
}
function stopJourney(){
  routeState.playing = false;
  if(routeState.timer){ clearInterval(routeState.timer); routeState.timer = null; }
}

// --- Zoom ---
function applySeqZoom(){
  const svg = document.querySelector("#view-t03 svg.seq");
  if(!svg) return;
  const vw = Number(svg.getAttribute("data-vw") || 0);
  const vh = Number(svg.getAttribute("data-vh") || 0);
  if(!vw || !vh) return;
  svg.setAttribute("width", String(Math.round(vw * zoomLevel)));
  svg.setAttribute("height", String(Math.round(vh * zoomLevel)));
}
function setZoom(z){
  zoomLevel = Math.min(2, Math.max(0.5, Math.round(z*20)/20));
  const inner = $("canvas-inner");
  inner.style.transform = "";
  if(tab === "t03"){
    inner.style.zoom = "1";
    applySeqZoom();
  } else {
    inner.style.zoom = String(zoomLevel);
    requestAnimationFrame(() => { if(tab==="t01") drawT01Wires(); if(tab==="t02") drawT02Wires(); });
  }
  $("zoom-pct").textContent = Math.round(zoomLevel*100)+"%";
}

document.querySelectorAll(".tab").forEach(b => b.onclick = () => switchTab(b.dataset.tab));
document.querySelectorAll(".chip").forEach(b => b.onclick = () => {
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); filterOp = b.dataset.op; render();
});
$("q").oninput = e => { query = e.target.value.trim().toLowerCase(); render(); };
$("btn-theme").onclick = () => {
  const next = document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark";
  setTheme(next);
  render();
};
$("btn-preset").onclick = () => {
  const wrap = $("preset-wrap");
  const open = wrap.classList.toggle("open");
  $("btn-preset").setAttribute("aria-expanded", String(open));
};
document.querySelectorAll(".preset-option").forEach(b => {
  b.onclick = () => setPreset(b.dataset.preset);
});

// Zoom controls
$("zoom-in").onclick = () => setZoom(zoomLevel+0.1);
$("zoom-out").onclick = () => setZoom(zoomLevel-0.1);
$("zoom-reset").onclick = () => setZoom(1);

// Detail drawer
$("detail-close").onclick = closeDetail;
$("detail-copy").onclick = () => { writeHash(); copyText(location.href); };

// Route panel
$("btn-route").onclick = () => { const p = $("route-panel"); p.hidden ? openRoutePanel() : closeRoutePanel(); };
$("route-close").onclick = closeRoutePanel;

// Node finder
$("btn-finder").onclick = () => openFinder("jump");
$("finder-close").onclick = closeFinder;
$("finder-input").addEventListener("input", e => renderFinderResults(e.target.value));
$("finder-input").addEventListener("keydown", e => {
  if (e.key==="ArrowDown") { e.preventDefault(); moveFinderActive(1); }
  else if (e.key==="ArrowUp") { e.preventDefault(); moveFinderActive(-1); }
  else if (e.key==="Enter") { e.preventDefault(); chooseFinderResult(finderCurrentItems[finderActiveIndex]); }
  else if (e.key==="Escape") { e.preventDefault(); closeFinder(); }
});
$("finder-overlay").addEventListener("click", e => { if (e.target.id==="finder-overlay") closeFinder(); });

window.addEventListener("hashchange", () => {
  readHash();
  syncTabButtons();
  render();
  renderDetail();
  renderRoutePanel();
  if (routeState.path) $("route-panel").hidden = false;
});

document.addEventListener("click", e => {
  const wrap = $("preset-wrap");
  if (wrap && wrap.classList.contains("open") && !wrap.contains(e.target)) {
    wrap.classList.remove("open");
    $("btn-preset").setAttribute("aria-expanded", "false");
  }
});
document.addEventListener("keydown", e => {
  if (e.target && ["INPUT","TEXTAREA"].includes(e.target.tagName)) return;
  if (e.key==="Escape") {
    const wrap = $("preset-wrap");
    if (wrap) { wrap.classList.remove("open"); $("btn-preset").setAttribute("aria-expanded", "false"); }
    if (!$("finder-overlay").hidden) closeFinder();
    else if (!$("detail-drawer").hidden) closeDetail();
    else if (!$("route-panel").hidden) closeRoutePanel();
  }
  if (e.key==="t" || e.key==="T") setTheme(document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark");
  if (e.key==="s" || e.key==="S") {
    const cur=document.documentElement.getAttribute("data-preset")||"classic";
    setPreset(PRESET_ORDER[(PRESET_ORDER.indexOf(cur)+1)%PRESET_ORDER.length]);
  }
  if (e.key==="/") { e.preventDefault(); openFinder("jump"); }
  if (e.key==="r" || e.key==="R") { const p = $("route-panel"); p.hidden ? openRoutePanel() : closeRoutePanel(); }
  if (e.key==="+" || e.key==="=") { e.preventDefault(); setZoom(zoomLevel+0.1); }
  if (e.key==="-") { e.preventDefault(); setZoom(zoomLevel-0.1); }
  if (e.key==="0") { e.preventDefault(); setZoom(1); }
});

boot();
</script>
</body>
</html>
