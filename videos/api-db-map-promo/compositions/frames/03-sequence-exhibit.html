      <div data-hf-id="hf-hb9w" id="03-sequence-exhibit-plate" data-layout-allow-overflow="true">

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const plate = document.getElementById("03-sequence-exhibit-plate");
      const world = document.getElementById("03-sequence-exhibit-world");
      const shot = document.getElementById("03-sequence-exhibit-shot");
      const target = document.getElementById("03-sequence-exhibit-update");
      const words = [
        document.getElementById("03-sequence-exhibit-w0"),
        document.getElementById("03-sequence-exhibit-w1"),
        document.getElementById("03-sequence-exhibit-w2"),
        document.getElementById("03-sequence-exhibit-w3"),
      ];

      const pr = plate.getBoundingClientRect();
      const tr = target.getBoundingClientRect();
      const sr = shot.getBoundingClientRect();
      const plateW = pr.width || 1758.72;
      const plateH = pr.height || 590.24;
      const plateCx = (pr.width ? pr.left : 80.64) + plateW / 2;
      const plateCy = (pr.height ? pr.top : 141.3) + plateH / 2;
      const shotW = sr.width || plateH * (2048 / 1380);
      const shotH = sr.height || plateH;

      let ox;
      let oy;
      let barW;
      if (tr.width >= 1) {
        ox = tr.left + tr.width / 2 - plateCx;
        oy = tr.top + tr.height / 2 - plateCy;
        barW = tr.width;
      } else {
        ox = (0.4724 - 0.5) * shotW;
        oy = (0.6203 - 0.5) * shotH;
        barW = 0.311 * shotW;
      }

      const maxS = (0.88 * plateW) / Math.max(barW, 1);
      const S0 = Math.min(5.4, Math.max(3.2, maxS));
      const startX = -ox * S0;
      const startY = -oy * S0;

      // Scene 1 (0–3s): tight on UPDATE finalized; blur-to-sharp. Camera holds.
      tl.fromTo(
        plate,
        { filter: "blur(5px)" },
        { filter: "blur(0px)", duration: 1.2, ease: "power2.out" },
        0,
      );

      // Scene 2 (3.0–8.5s): ONE decelerating zoom-out to the full T·03 plate.
      tl.fromTo(
        world,
        { x: startX, y: startY, scale: S0 },
        { x: 0, y: 0, scale: 1, duration: 5.5, ease: "expo.out" },
        3.0,
      );

      // Scene 3 (8.5–14s): lock. Caption per-word. No second camera move.
      for (let i = 0; i < words.length; i += 1) {
        tl.fromTo(
          words[i],
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.48, ease: "power3.out" },
          8.5 + i * 0.22,
        );
      }

      window.__timelines["03-sequence-exhibit"] = tl;
    })();
  </script>
