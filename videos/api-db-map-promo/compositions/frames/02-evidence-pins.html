  <script>
    const tl = gsap.timeline({ paused: true });
    const el = (id) => document.getElementById(id);

    const plate = el("02-evidence-pins-plate");
    const kicker = el("02-evidence-pins-kicker");
    const line1 = el("02-evidence-pins-line1");
    const line2 = el("02-evidence-pins-line2");
    const status = el("02-evidence-pins-status");
    const spinnerArc = el("02-evidence-pins-spinner-arc");
    const lastJitter = el("02-evidence-pins-jitter");

    const chips = [0, 1, 2].map((i) => ({
      card: el("02-evidence-pins-chip-" + i),
      pending: el("02-evidence-pins-pending-" + i),
      done: el("02-evidence-pins-done-" + i),
      check: el("02-evidence-pins-check-" + i),
    }));

    const checkLens = chips.map((c) => {
      const len = c.check.getTotalLength();
      c.check.style.strokeDasharray = String(len);
      c.check.style.strokeDashoffset = String(len);
      return len;
    });

    tl.fromTo(
      plate,
      { opacity: 0 },
      { opacity: 1, duration: 0.55, ease: "power2.out" },
      0
    );

    tl.fromTo(
      kicker,
      { opacity: 0, scale: 0, y: 10 },
      {
        opacity: 1,
        scale: 1,
        y: 0,
        duration: 0.48,
        ease: "power3.out",
        transformOrigin: "0% 50%",
      },
      0.04
    );

    tl.fromTo(
      line1,
      { opacity: 0, scale: 0, y: 14 },
      {
        opacity: 1,
        scale: 1,
        y: 0,
        duration: 0.58,
        ease: "power3.out",
        transformOrigin: "0% 50%",
      },
      0.1
    );

    tl.fromTo(
      line2,
      { opacity: 0, y: 12 },
      { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      2.5
    );

    tl.fromTo(
      status,
      { opacity: 0, y: 8 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      2.5
    );

    const spin = { deg: 0 };
    const spinStart = 2.5;
    const spinEnd = 9.45;
    tl.fromTo(
      spin,
      { deg: 0 },
      {
        deg: 360 * 7.35,
        duration: spinEnd - spinStart,
        ease: "none",
        onUpdate: function () {
          spinnerArc.setAttribute("transform", "rotate(" + spin.deg + " 12 12)");
        },
      },
      spinStart
    );

    function enterChip(card, at) {
      tl.fromTo(
        card,
        { opacity: 0, y: 28, scale: 0.96 },
        {
          opacity: 1,
          y: 0,
          scale: 1,
          duration: 0.5,
          ease: "power3.out",
          transformOrigin: "50% 50%",
        },
        at
      );
    }

    function checkOff(item, len, at) {
      tl.fromTo(
        item.pending,
        { scale: 1, opacity: 1 },
        {
          scale: 0.72,
          opacity: 0,
          duration: 0.28,
          ease: "power2.in",
          transformOrigin: "50% 50%",
          immediateRender: false,
        },
        at
      );
      tl.fromTo(
        item.done,
        { scale: 0.72, opacity: 0 },
        {
          scale: 1,
          opacity: 1,
          duration: 0.42,
          ease: "power3.out",
          transformOrigin: "50% 50%",
          immediateRender: false,
        },
        at + 0.12
      );
      tl.fromTo(
        item.check,
        { strokeDashoffset: len },
        {
          strokeDashoffset: 0,
          duration: 0.32,
          ease: "power2.out",
          immediateRender: false,
        },
        at + 0.18
      );
    }

    enterChip(chips[0].card, 2.65);
    checkOff(chips[0], checkLens[0], 4.15);

    enterChip(chips[1].card, 6.05);
    checkOff(chips[1], checkLens[1], 7.15);

    enterChip(chips[2].card, 8.05);
    checkOff(chips[2], checkLens[2], 9.15);

    tl.fromTo(
      status,
      { opacity: 1, y: 0 },
      {
        opacity: 0,
        y: 0,
        duration: 0.28,
        ease: "power2.in",
        immediateRender: false,
      },
      9.45
    );

    tl.fromTo(
      lastJitter,
      { y: 0 },
      { y: 2, duration: 0.5, ease: "sine.inOut", immediateRender: false },
      10
    );
    tl.fromTo(
      lastJitter,
      { y: 2 },
      { y: -2, duration: 1, ease: "sine.inOut", immediateRender: false },
      10.5
    );
    tl.fromTo(
      lastJitter,
      { y: -2 },
      { y: 2, duration: 1, ease: "sine.inOut", immediateRender: false },
      11.5
    );
    tl.fromTo(
      lastJitter,
      { y: 2 },
      { y: -2, duration: 1, ease: "sine.inOut", immediateRender: false },
      12.5
    );
    tl.fromTo(
      lastJitter,
      { y: -2 },
      { y: 0, duration: 0.5, ease: "sine.inOut", immediateRender: false },
      13.5
    );

    window.__timelines["02-evidence-pins"] = tl;
