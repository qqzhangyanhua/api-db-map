  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const el = (id) => document.getElementById(id);

      const POP_DUR = 0.52;
      const Y_RISE = 10;
      const ROW_DUR = 0.5;
      const ROW_Y = 16;
      const CHECK_LAG = 0.72;
      const BASE_DURATION = 0.6;
      const SEC_PER_CHAR = 0.04;
      const HOLD_MID = 0.5;
      const HOLD_FINAL = 1.0;
      const SCENE2_AT = 1.4;
      const SCENE_WINDOW = 5.6;

      tl.fromTo(
        el("05-evidence-kicker"),
        { scale: 0, opacity: 0, y: Y_RISE },
        { scale: 1, opacity: 1, y: 0, duration: POP_DUR, ease: "power3.out" },
        0
      );
      tl.fromTo(
        el("05-evidence-title"),
        { scale: 0, opacity: 0, y: Y_RISE },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        0.06
      );
      tl.fromTo(
        el("05-evidence-path"),
        { scale: 0, opacity: 0, y: Y_RISE },
        { scale: 1, opacity: 1, y: 0, duration: POP_DUR, ease: "power3.out" },
        0.16
      );
      tl.fromTo(
        el("05-evidence-list"),
        { scale: 0, opacity: 0, y: 12 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        0.42
      );

      const CONTENT = [
        { id: "05-evidence-row-0", pending: "05-evidence-pending-0", done: "05-evidence-done-0", check: "05-evidence-check-0", body: "recording_task UPDATE", hold: HOLD_MID },
        { id: "05-evidence-row-1", pending: "05-evidence-pending-1", done: "05-evidence-done-1", check: "05-evidence-check-1", body: "upload_session UPDATE", hold: HOLD_MID },
        { id: "05-evidence-row-2", pending: "05-evidence-pending-2", done: "05-evidence-done-2", check: "05-evidence-check-2", body: "work_job INSERT", hold: HOLD_FINAL },
      ];

      let cumulative = 0;
      const RAW = CONTENT.map((entry) => {
        const dur = BASE_DURATION + entry.body.length * SEC_PER_CHAR + entry.hold;
        const start = cumulative;
        cumulative += dur;
        return { ...entry, start, end: cumulative };
      });
      const scale = SCENE_WINDOW / cumulative;
      const TIMELINE = RAW.map((entry) => ({
        ...entry,
        start: SCENE2_AT + entry.start * scale,
        end: SCENE2_AT + entry.end * scale,
      }));

      TIMELINE.forEach((entry) => {
        const row = el(entry.id);
        const pending = el(entry.pending);
        const done = el(entry.done);
        const check = el(entry.check);
        const len = check.getTotalLength();
        check.style.strokeDasharray = String(len);
        check.style.strokeDashoffset = String(len);

        tl.fromTo(
          row,
          { scale: 0, opacity: 0, y: ROW_Y },
          { scale: 1, opacity: 1, y: 0, duration: ROW_DUR, ease: "power3.out" },
          entry.start
        );
        tl.fromTo(
          pending,
          { scale: 1, opacity: 1 },
          { scale: 0.72, opacity: 0, duration: 0.28, ease: "power2.in" },
          entry.start + CHECK_LAG
        );
        tl.fromTo(
          done,
          { scale: 0.72, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
          entry.start + CHECK_LAG + 0.12
        );
        tl.fromTo(
          check,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" },
          entry.start + CHECK_LAG + 0.18
        );
      });

      window.__timelines["05-evidence"] = tl;
    })();
  </script>
