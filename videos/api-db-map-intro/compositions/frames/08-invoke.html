  <div data-hf-id="hf-43we" id="root" data-composition-id="08-invoke" data-start="0" data-duration="7.5" data-width="1920" data-height="1080">
    <div data-hf-id="hf-3yaf" id="08-invoke-bg" class="clip" data-start="0" data-duration="7.5" data-track-index="0"></div>
    <div data-hf-id="hf-c9ov" id="08-invoke-stage" class="clip" data-start="0" data-duration="7.5" data-track-index="1">
      <div data-hf-id="hf-brpo" id="08-invoke-kicker">显式调用</div>
      <h2 data-hf-id="hf-wr0m" id="08-invoke-title">说这一句，才跑</h2>
      <p data-hf-id="hf-v4dm" id="08-invoke-lead">提到表或接口，不会自动触发</p>
      <div data-hf-id="hf-a98l" id="08-invoke-row">
        <div data-hf-id="hf-nu9y" id="08-invoke-request">用 <span data-hf-id="hf-ut75" id="08-invoke-brand">api-db-map</span></div>
        <div data-hf-id="hf-c5it" id="08-invoke-cmd">
          <span data-hf-id="hf-fehe" id="08-invoke-prompt">$</span>
          <span data-hf-id="hf-gf5a" id="08-invoke-text-wrap">
            <span data-hf-id="hf-79d1" id="08-invoke-text"></span><span data-hf-id="hf-9nk6" id="08-invoke-cursor"></span>
          </span>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const DURATION = 7;
      const POP_DUR = 0.55;
      const Y_RISE = 10;
      const TEXT = "#e8f1ff";
      const CYAN = "#37d5ff";
      const CURSOR_H = 24;
      const CURSOR_H_BRAND = 28;
      const BLINK_CYCLES = 7;
      const TYPING_GRACE = 0.22;
      const FULL = "用 api-db-map 分析 POST /v1/tasks/{task_id}/finalize";

      const kicker = document.getElementById("08-invoke-kicker");
      const title = document.getElementById("08-invoke-title");
      const lead = document.getElementById("08-invoke-lead");
      const request = document.getElementById("08-invoke-request");
      const cmd = document.getElementById("08-invoke-cmd");
      const textEl = document.getElementById("08-invoke-text");
      const cursorEl = document.getElementById("08-invoke-cursor");

      tl.fromTo(kicker, { scale: 0, opacity: 0, y: Y_RISE }, { scale: 1, opacity: 1, y: 0, duration: POP_DUR, ease: "power3.out" }, 0);
      tl.fromTo(title, { scale: 0, opacity: 0, y: Y_RISE }, { scale: 1, opacity: 1, y: 0, duration: POP_DUR, ease: "power3.out" }, 0.1);
      tl.fromTo(lead, { scale: 0, opacity: 0, y: Y_RISE }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.55);
      tl.fromTo(request, { scale: 0, opacity: 0, y: 12 }, { scale: 1, opacity: 1, y: 0, duration: POP_DUR, ease: "power3.out" }, 1.6);
      tl.fromTo(cmd, { scale: 0, opacity: 0, y: 12 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.2);

      const SEQUENCE = [
        { t: 0, text: "", segment: "main", color: TEXT },
        { t: 3.42, text: "用", segment: "main", color: TEXT },
        { t: 3.5, text: "用 ", segment: "main", color: TEXT },
        { t: 3.64, text: "用 a", segment: "brand", color: CYAN },
        { t: 3.72, text: "用 ap", segment: "brand", color: CYAN },
        { t: 3.8, text: "用 api", segment: "brand", color: CYAN },
        { t: 3.88, text: "用 api-", segment: "brand", color: CYAN },
        { t: 3.96, text: "用 api-d", segment: "brand", color: CYAN },
        { t: 4.04, text: "用 api-db", segment: "brand", color: CYAN },
        { t: 4.12, text: "用 api-db-", segment: "brand", color: CYAN },
        { t: 4.2, text: "用 api-db-m", segment: "brand", color: CYAN },
        { t: 4.28, text: "用 api-db-ma", segment: "brand", color: CYAN },
        { t: 4.38, text: "用 api-db-map", segment: "brand", color: CYAN },
        { t: 4.58, text: "用 api-db-map ", segment: "main", color: TEXT },
        { t: 4.66, text: "用 api-db-map 分", segment: "main", color: TEXT },
        { t: 4.74, text: "用 api-db-map 分析", segment: "main", color: TEXT },
        { t: 4.8, text: "用 api-db-map 分析 ", segment: "main", color: TEXT },
        { t: 4.86, text: "用 api-db-map 分析 P", segment: "main", color: TEXT },
        { t: 4.91, text: "用 api-db-map 分析 PO", segment: "main", color: TEXT },
        { t: 4.96, text: "用 api-db-map 分析 POS", segment: "main", color: TEXT },
        { t: 5.0, text: "用 api-db-map 分析 POST", segment: "main", color: TEXT },
        { t: 5.06, text: "用 api-db-map 分析 POST ", segment: "main", color: TEXT },
        { t: 5.42, text: FULL, segment: "cmd", color: CYAN },
      ];

      const CHANGE_TIMES = SEQUENCE.filter(function (e, i) {
        return i > 0 && e.text !== SEQUENCE[i - 1].text;
      }).map(function (e) {
        return e.t;
      });

      function entryAt(time) {
        for (let i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i];
        }
        return SEQUENCE[0];
      }

      const driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            const entry = entryAt(driver.t);
            textEl.textContent = entry.text;
            cursorEl.style.background = entry.color;
            cursorEl.style.height = entry.segment === "brand" ? CURSOR_H_BRAND + "px" : CURSOR_H + "px";
          },
        },
        0
      );

      const blink = { p: 0 };
      tl.to(
        blink,
        {
          p: Math.PI * 2 * BLINK_CYCLES,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            const isTyping = CHANGE_TIMES.some(function (t) {
              return t <= driver.t && driver.t - t < TYPING_GRACE;
            });
            cursorEl.style.opacity = isTyping ? "1" : Math.sin(blink.p) > 0 ? "1" : "0";
          },
        },
        0
      );

      window.__timelines["08-invoke"] = tl;
    })();
  </script>
