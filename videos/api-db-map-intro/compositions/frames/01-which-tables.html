  <script>
    const tl = gsap.timeline({ paused: true });

    tl.fromTo(
      document.getElementById("01-which-tables-kicker"),
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.48, ease: "power3.out" },
      0.0,
    );

    const wordEls = gsap.utils.toArray("[id='01-which-tables-title'] [class='01-which-tables-word']");
    const BASE_DURATION = 0.06;
    const SEC_PER_CHAR = 0.04;
    let titleAt = 0;
    wordEls.forEach((el) => {
      const start = titleAt;
      titleAt += BASE_DURATION + String(el.textContent).length * SEC_PER_CHAR;
      tl.fromTo(
        el,
        { scale: 0, opacity: 0, y: 8 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        1.0 + start,
      );
    });

    tl.fromTo(
      document.getElementById("01-which-tables-lead"),
      { scale: 0, opacity: 0, y: 10 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      2.2,
    );

    tl.fromTo(
      document.getElementById("01-which-tables-request"),
      { scale: 0, opacity: 0, x: -28 },
      { scale: 1, opacity: 1, x: 0, duration: 0.55, ease: "power3.out" },
      2.35,
    );

    const grid = document.getElementById("01-which-tables-grid");
    const nodes = gsap.utils.toArray("[id='01-which-tables-grid'] [class='01-which-tables-node']");
    const gap = 18;
    const w = Math.max(grid.clientWidth, 900);
    const h = Math.max(grid.clientHeight, 360);
    const stepX = (w - gap * 2) / 3 + gap;
    const stepY = (h - gap) / 2 + gap;
    const START_PROGRESS = 0.3;
    nodes.forEach((el, i) => {
      const col = i % 3;
      const row = (i / 3) | 0;
      const tx = (col - 1) * stepX;
      const ty = (row === 0 ? -0.5 : 0.5) * stepY;
      el.setAttribute("data-target-x", String(tx));
      el.setAttribute("data-target-y", String(ty));
      tl.fromTo(
        el,
        {
          xPercent: -50,
          yPercent: -50,
          x: tx * START_PROGRESS,
          y: ty * START_PROGRESS,
          scale: 0.6,
          opacity: 0,
        },
        {
          xPercent: -50,
          yPercent: -50,
          x: tx,
          y: ty,
          scale: 1,
          opacity: 1,
          duration: 1.2,
          ease: "power3.out",
        },
        3.2 + i * 0.06,
      );
    });

    window.__timelines["01-which-tables"] = tl;
